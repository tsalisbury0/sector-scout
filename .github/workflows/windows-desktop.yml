name: Windows desktop

# The desktop app needs Visual Studio's C++ workload, which the Windows runners
# already carry, so this builds it there instead of on a dev machine.
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "windows/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build the Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Developer Mode
        shell: pwsh
        # Flutter needs to create plugin symlinks, which Windows only allows
        # with Developer Mode on (or an elevated process). The runner is admin.
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          New-Item -ItemType SymbolicLink -Path symlink-proof -Target pubspec.yaml | Out-Null
          if (Test-Path symlink-proof) { Write-Host "symlinks work" } else { exit 1 }

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build
        id: build
        shell: pwsh
        # The failure text is needed even when the build breaks, so it is teed
        # into a log the next step can publish as the run summary.
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-windows.log
          exit $LASTEXITCODE

      - name: Publish the log when the build fails
        if: failure()
        shell: pwsh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Build failed. Last 120 lines:"
          if (Test-Path build-windows.log) {
            Get-Content build-windows.log -Tail 120 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
          # The run log needs a login; a public branch does not, so the whole
          # log is parked there for whoever is diagnosing the failure.
          if (-not (Test-Path build-windows.log)) { "no log written" | Out-File build-windows.log }
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-build-log
          git rm -rf --cached . | Out-Null
          git add -f build-windows.log
          git commit -m "Windows build log"
          git push -f "https://x-access-token:$env:TOKEN@github.com/${{ github.repository }}.git" ci-build-log

      - uses: actions/upload-artifact@v4
        with:
          name: sector-scout-windows
          # upload-artifact zips a directory itself, so the release folder goes
          # up as it is built: exe, DLLs, data and all.
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
