name: Release

# The APK, the Windows app and the desktop package are built here and attached
# to a GitHub Release. Nothing built is committed: the repository holds source
# only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Fetch the APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > sector-scout.jks
          echo "KEYSTORE_PATH=$PWD/sector-scout.jks" >> "$GITHUB_ENV"
      - name: Build the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk              "sector-scout-${version}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: sector-scout-*.apk
          if-no-files-found: error

  desktop:
    name: Desktop package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package the console
        run: |
          version="${GITHUB_REF_NAME#v}"
          root="sector-scout-desktop-${version}"
          mkdir -p "$root/desktop"
          cp desktop/sector_scout_desktop.py desktop/sector_scout.ico "$root/desktop/"
          cp desktop/requirements.txt "$root/desktop/"
          # The script looks for bands.json one folder above itself.
          cp bands.json "$root/bands.json"
          cat > "$root/README.txt" <<'TXT'
          Sector Scout Desktop

          Needs Python 3 on Windows. There is nothing to install: the console
          uses tkinter, which ships with Python.

              python desktop\sector_scout_desktop.py

          Use pythonw.exe instead of python.exe to start it without a console
          window. Keep bands.json in the folder above desktop\, where the script
          looks for it.

          Bluetooth sharing and watching need one extra package:

              pip install -r desktop/requirements.txt

          It answers the same /snapshot JSON as the phone, on port 41729, and
          polls phones that have LAN or Bluetooth sharing turned on.
          TXT
          cd "$root/.." && zip -r "$root.zip" "$root"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-zip
          path: sector-scout-desktop-*.zip
          if-no-files-found: error

  windows:
    name: Python console installer
    runs-on: windows-latest
    # The installer is a convenience, not the release's reason to exist: a
    # break here cannot hold back a release that already has the app zip.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: python -m pip install --upgrade pyinstaller bleak
      - name: Build the app
        run: python desktop/build_windows.py
      - name: Build the installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "desktop\Sector Scout Desktop.iss"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: build/installer/*.exe
          if-no-files-found: error

  flutter-windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Developer Mode
        shell: pwsh
        # Flutter needs to create plugin symlinks, which Windows only allows
        # with Developer Mode on (or an elevated process). The runner is admin.
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
      - name: Fetch packages
        run: flutter pub get
      - name: Build
        run: flutter build windows --release
      - name: Package the app folder
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $stage = "sector-scout-windows-$version"
          Copy-Item -Recurse "build\windows\x64\runner\Release" $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: sector-scout-windows-*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [android, desktop, windows, flutter-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # A tag like v1.0.2-beta publishes as a prerelease; stable tags stay
          # regular releases. This is what keeps beta builds off the phone
          # app's update check unless the beta switch is on.
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          body: |
            The Windows app, the Python console and the phone app are three
            separate downloads above.

            - **sector-scout-windows-*.zip** — the Windows app. Unzip the folder
              and run `SectorScout.exe`; nothing to install.
            - **sector-scout-desktop-*.zip** — the Python console. Needs Python 3
              on this machine; see the README inside.
            - **sector-scout-*.apk** — the Android phone app.

            **Note:** the Windows app's Bluetooth watching is new and can be
            unreliable — it is the piece most likely to misbehave, and a phone
            that will not answer over Bluetooth may still answer over Wi-Fi, or
            through the Python console. (The reading over Wi-Fi and the serving
            of test readings are unaffected.)
