name: Android APK

# Builds the phone app on demand and attaches the APK to the run. The release
# workflow is the one that publishes; this exists so a build that fixes
# something on the phone can be installed and tested without cutting a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Fetch the APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > sector-scout.jks
          echo "KEYSTORE_PATH=$PWD/sector-scout.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          sha="$(git rev-parse --short HEAD)"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "sector-scout-${sha}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: sector-scout-*.apk
          if-no-files-found: error
