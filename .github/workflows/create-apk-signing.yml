name: Create the APK signing key

# One-off. Generates the release signing keystore once, with a password this
# invents and never prints. The keystore + password go into a *private*
# artifact, then become repo secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD). The keystore is never committed. Delete this
# workflow after setup so the one key can never be overwritten by accident.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    name: Generate the keystore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate the keystore
        run: |
          password="$(openssl rand -hex 32)"
          keytool -genkeypair \
            -keystore sector-scout.jks \
            -storetype PKCS12 \
            -alias sector-scout \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Sector Scout, OU=Apps, O=Sector Scout, L=Unknown, ST=Unknown, C=US" \
            -storepass "$password"
          base64 -w0 sector-scout.jks > sector-scout.jks.b64
          printf '%s\n' "$password" > password.txt
          printf '%s\n' 'sector-scout' > alias.txt
      - uses: actions/upload-artifact@v7
        with:
          name: signing-key
          path: |
            sector-scout.jks.b64
            password.txt
            alias.txt
          if-no-files-found: error
